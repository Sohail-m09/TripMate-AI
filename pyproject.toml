[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"


[project]
name = "tripmate-ai"
version = "0.1.0"
description = "Multi-agent travel planning system using LangGraph and MCP"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "langchain>=1.0",
    "langgraph>=1.0",
    "langchain-google-genai>=4.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "mcp[cli]>=1.24,<2",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "httpx>=0.28",
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]